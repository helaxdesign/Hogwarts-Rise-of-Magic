<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a0f">
  <title>Hogwarts: Rise of Magic</title>
  <meta name="description" content="RPG de Hogwarts — Salão Principal, Taça das Casas, treinos de perícias e painel da staff.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IM+Fell+English:ital@0;1&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%237a1414'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23f3d58a' font-family='serif'%3EH%3C/text%3E%3C/svg%3E">
</head>
<body>
  <!-- Céu estrelado + brilho mágico -->
  <div class="sky" aria-hidden="true"></div>
  <div class="sparkles" id="sparkles" aria-hidden="true"></div>

  <!-- ===================== APLICAÇÃO ===================== -->
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-small">Hogwarts</span>
        <span class="brand-title">Rise of Magic</span>
      </div>
      <span class="mode-chip" id="modeChip" hidden>Modo local</span>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Navegação principal">
      <a href="#/salao" data-route="salao">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h12M6 22h12M7 2c0 6 5 7 5 10s-5 4-5 10M17 2c0 6-5 7-5 10s5 4 5 10"/></svg>
        <span>Salão Principal</span>
      </a>
      <a href="#/trabalhos" data-route="trabalhos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5zM4 21.5A2.5 2.5 0 0 1 6.5 19H20v3H6.5M8 7h8M8 11h6"/></svg>
        <span>Trabalhos</span>
      </a>
      <a href="#/treinos" data-route="treinos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20 17 7M15 5l4 4M19 3l.6 1.4L21 5l-1.4.6L19 7l-.6-1.4L17 5l1.4-.6zM8 3l.4 1L9.4 4.4 8.4 4.8 8 6l-.4-1.2-1-.4 1-.4z"/></svg>
        <span>Treinos</span>
      </a>
      <a href="#/staff" data-route="staff">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12 20 3M16 7l3 3M18 5l2 2"/></svg>
        <span>Staff</span>
      </a>
    </nav>
  </div>

  <!-- Folha inferior (modal) -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-grip"></div>
    <button class="sheet-close" id="sheetClose" aria-label="Fechar">×</button>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <!-- Visualizador de imagem -->
  <div class="lightbox" id="lightbox" hidden>
    <img alt="Print enviado" id="lightboxImg">
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/houses.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/trabalhos.js"></script>
</body>
</html>
